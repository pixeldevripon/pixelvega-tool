name: CI

on:
  push:
  pull_request:

env:
  PNPM_CONFIG_STRICT_DEP_BUILDS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: if [ -f prisma/schema.prisma ]; then pnpm prisma generate; else echo "no prisma schema, skipping"; fi

      - run: pnpm build
